name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint, scripts and cross-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck (also feeds actionlint's run-block checks)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck

      - name: actionlint — workflow semantics
        run: |
          # GOPATH/bin is not on the runner PATH — invoke by absolute path.
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

      - name: Rust style
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Cross-target compile smoke (no link — catches cfg bugs pre-release)
        run: |
          rustup target add x86_64-pc-windows-msvc aarch64-apple-darwin aarch64-unknown-linux-gnu
          for t in x86_64-pc-windows-msvc aarch64-apple-darwin aarch64-unknown-linux-gnu; do
            cargo check --locked --all-targets --target "$t"
          done

      - run: shellcheck -x install.sh uninstall.sh platforms/*/*.sh scripts/*.sh
      - run: ./scripts/check-version.sh

      - name: Validate the launchd plist
        run: python3 -c 'import plistlib; plistlib.load(open("platforms/macos/launchd/io.nddev.rldyour-cleaner.plist","rb"))'

      - name: Verify the systemd units
        run: |
          # Exec path must exist for verify; give it a stub.
          mkdir -p "$HOME/.local/bin"
          install -m755 /dev/null "$HOME/.local/bin/rldyour-cleaner"
          # `verify` exits 0 even on real errors, so the gate is the output:
          # any line naming our units is a finding.
          out=$(systemd-analyze verify \
            platforms/linux/systemd/rldyour-cleaner.service \
            platforms/linux/systemd/rldyour-cleaner.timer 2>&1)
          echo "$out"
          ! grep -q rldyour-cleaner <<<"$out"

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, macos-26-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install the oldest audited uv for synthetic contract checks
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.17'
          enable-cache: false
      - name: Real uv 0.12.17 preservation/locking contract
        run: python scripts/check-uv-contract.py --uv uv --cleaner target/debug/rldyour-cleaner
      - name: Install the latest audited uv for synthetic contract checks
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Real uv 0.12.23 preservation/locking contract
        run: python scripts/check-uv-contract.py --uv uv --cleaner target/debug/rldyour-cleaner
      - name: Synthetic Unix installer lifecycle
        if: runner.os != 'Windows'
        run: python3 scripts/check-installers.py
      - name: Synthetic Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-installers.ps1
      - name: Parse the PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($f in 'install.ps1', 'uninstall.ps1', 'platforms/windows/install.ps1', 'platforms/windows/uninstall.ps1') {
            try {
              $null = [scriptblock]::Create((Get-Content $f -Raw))
              Write-Host "$f parses"
            } catch {
              Write-Error "$f failed to parse: $_"
              exit 1
            }
          }

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --all-targets --locked

  audit:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@ab62f45b2a3067e5a7425d703f7fd07f1618b72c # nddev-cicd-v0.6.14
        with:
          capability: rust
      - run: cargo audit

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@ab62f45b2a3067e5a7425d703f7fd07f1618b72c # nddev-cicd-v0.6.14
        with:
          capability: security
      - name: Lint and audit workflows
        run: |
          actionlint
          zizmor --offline --no-progress .github/workflows/ci.yml .github/dependabot.yml
      - name: Scan new pull request commits, or the full history on main
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            gitleaks git --no-banner --redact --log-opts="$BASE..$HEAD" .
          else
            gitleaks git --no-banner --redact .
          fi

